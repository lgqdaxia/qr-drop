<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="Drop, choose or paste an image to read its QR code. Images stay on your device." data-i18n-content="description">
  <title>QR · Decode</title>
  <link rel="icon" href="./favicon.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=4">
  <script src="./i18n.js?v=4" defer></script>
  <script src="./app.js?v=4" defer></script>
</head>
<body>
  <header class="header">
    <div class="language-switch">
      <button id="language-button" class="icon-button" type="button" aria-label="Language" title="Language" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-en"></use></svg></button>
      <div id="language-menu" class="language-menu" role="menu" aria-label="Language" data-i18n-aria-label="chooseLanguage" hidden>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="zh-Hans" aria-label="简体中文" title="简体中文"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-zh-Hans"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="zh-Hant" aria-label="繁體中文" title="繁體中文"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-zh-Hant"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="en" aria-label="English" title="English"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-en"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="ja" aria-label="日本語" title="日本語"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-ja"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="ko" aria-label="한국어" title="한국어"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-ko"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="es" aria-label="Español" title="Español"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-es"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="fr" aria-label="Français" title="Français"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-fr"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="de" aria-label="Deutsch" title="Deutsch"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-de"></use></svg></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-language="pt" aria-label="Português" title="Português"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><use href="./flags.svg#flag-pt"></use></svg></button>
        <button class="auto-language" type="button" role="menuitemradio" aria-checked="true" data-language="auto" aria-label="Automatic" title="Automatic" data-i18n-aria-label="automatic" data-i18n-title="automatic"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></button>
      </div>
    </div>
    <a class="github icon-button" href="https://github.com/lgqdaxia/qr-drop" target="_blank" rel="noopener noreferrer" aria-label="Source on GitHub" data-i18n-aria-label="sourceLabel" title="GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.86c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.82c.85 0 1.71.11 2.51.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg></a>
  </header>

  <main>
    <div class="tool">
      <input id="file-input" type="file" accept="image/*" hidden>
      <button id="drop-zone" class="drop-zone" type="button" aria-label="Drop a QR image, or click to choose one" data-i18n-aria-label="dropLabel">
        <span class="scan-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path class="corners" d="M19 7H9a2 2 0 0 0-2 2v10M45 7h10a2 2 0 0 1 2 2v10M57 45v10a2 2 0 0 1-2 2H45M19 57H9a2 2 0 0 1-2-2V45"/><path class="modules" d="M18 18h10v10H18zM36 18h10v10H36zM18 36h10v10H18zM36 36h4v4h-4zM42 42h4v4h-4zM42 34h4v4h-4zM34 42h4v4h-4z"/></svg></span>
        <span class="drop-title" data-i18n="dropTitle">Drop a QR image</span>
      </button>

      <section id="result" class="result" aria-label="Decoded result" data-i18n-aria-label="resultLabel" hidden>
        <div class="result-top"><span class="success-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="m5 10 3 3 7-7"/></svg></span><span data-i18n="detected">Decoded</span><button id="reset-button" class="icon-button" type="button" title="Start again" data-i18n-title="resetTitle" aria-label="Choose another image" data-i18n-aria-label="resetLabel"><svg viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
        <div class="result-content"><img id="preview" alt="QR image preview" data-i18n-alt="previewAlt"><pre id="result-text" tabindex="0" aria-label="QR content" data-i18n-aria-label="contentLabel"></pre></div>
        <div class="result-actions"><a id="open-link" class="secondary-button" target="_blank" rel="noopener noreferrer" hidden><span data-i18n="openLink">Open link</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10"/></svg></a><button id="copy-button" class="primary-button" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="2"/><path d="M12 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h2"/></svg><span data-i18n="copy">Copy</span></button></div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <footer><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="4" y="7" width="8" height="6" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg><span data-i18n="privacy">Local processing</span></footer>
  <div id="drag-overlay" class="drag-overlay" aria-hidden="true"><span data-i18n="release">Drop to decode</span></div>
</body>
</html>
